name: Windows package

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - apps/web/**
      - services/api/**
      - deploy/**
      - .github/workflows/windows-package.yml
      - pnpm-lock.yaml

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build dashboard
        shell: pwsh
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm --dir apps/web build
      - name: Build API executable
        shell: pwsh
        run: |
          # --collect-all zeroconf: the mDNS advertiser imports it lazily inside
          # functions; collecting explicitly guarantees its data/metadata ship
          # in the onefile exe rather than failing at first LAN scan.
          uv run --directory services/api --with pyinstaller pyinstaller --noconfirm --onefile --name MEC-AI-API --paths services/api/src --collect-all uvicorn --collect-all fastapi --collect-all zeroconf services/api/src/mecai_api/__main__.py
      - name: Build launcher (no-console GUI)
        shell: pwsh
        run: |
          pip install pyinstaller
          # --noconsole so no terminal pops up; onefile so they can copy it to Desktop
          pyinstaller --noconfirm --onefile --noconsole --name MECAI-Launcher --clean deploy/launcher/mecai_launcher.py
          if (!(Test-Path "dist/MECAI-Launcher.exe")) { Write-Error "launcher build failed"; exit 1 }
      - name: Assemble client bundle
        shell: pwsh
        run: |
          $bundle = "MEC-AI-Windows"
          New-Item -ItemType Directory -Force "$bundle\api", "$bundle\web", "$bundle\data" | Out-Null
          Copy-Item "services/api/dist/MEC-AI-API.exe" "$bundle\api\"
          Copy-Item "apps/web/.next/standalone/*" "$bundle\web\" -Recurse
          New-Item -ItemType Directory -Force "$bundle\web\.next" | Out-Null
          Copy-Item "apps/web/.next/static" "$bundle\web\.next\static" -Recurse
          Invoke-WebRequest "https://nodejs.org/dist/v24.14.0/node-v24.14.0-win-x64.zip" -OutFile "node.zip"
          Expand-Archive "node.zip" -DestinationPath "."
          Copy-Item "node-v24.14.0-win-x64/node.exe" "$bundle\web\node.exe"
          Copy-Item "deploy/windows/*.bat" "$bundle\"
          # GUI launcher — double-click, no terminal; also copy to root so Desktop shortcut can target it
          Copy-Item "dist/MECAI-Launcher.exe" "$bundle\MECAI-Launcher.exe"
          Copy-Item "dist/MECAI-Launcher.exe" "$bundle\..\MECAI-Launcher.exe" -ErrorAction SilentlyContinue
          # convenience: drag this shortcut-creator to Desktop
          @'
          $s = $WshShell = New-Object -comObject WScript.Shell
          $lnk = $s.CreateShortcut("$env:USERPROFILE\Desktop\MEC-AI.lnk")
          $lnk.TargetPath = Join-Path $PSScriptRoot "MECAI-Launcher.exe"
          $lnk.WorkingDirectory = $PSScriptRoot
          $lnk.Description = "MEC-AI — Start API + Dashboard"
          $lnk.Save()
          Write-Host "Shortcut created on Desktop -> MEC-AI.lnk"
          '@ | Set-Content "$bundle\Create-Desktop-Shortcut.ps1"
          @"
          MECAI_HOST=0.0.0.0
          MECAI_PORT=8000
          MECAI_DATABASE_PATH=data/mecai.db
          MECAI_ENABLE_MOCK_ENDPOINTS=false
          "@ | Set-Content "$bundle\.env"
          Compress-Archive -Path $bundle -DestinationPath MEC-AI-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MEC-AI-Windows
          path: MEC-AI-Windows.zip
          if-no-files-found: error
